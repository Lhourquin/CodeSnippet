services:
  nextjs:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app # Monte le dossier local dans le conteneur pour éviter de reconstruire à chaque modification
      - /app/node_modules # Évite les conflits entre node_modules du conteneur et de l'hôte
    environment:
      - NODE_ENV=development
    command: ["npm", "run", "dev"]
